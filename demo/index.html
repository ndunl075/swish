<!doctype html>
<!-- data-swish-bare: this page draws its own upload UI, so the overlay only adds the hoop and ball. -->
<html lang="en" data-swish-bare>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swish demo</title>
  <style>
    :root {
      --bg: #f3f4f6; --card: #fff; --fg: #0f172a; --muted: #64748b; --faint: #94a3b8;
      --line: #e5e7eb; --dash: #cbd5e1; --chip: #eef0f6; --chip-line: #dfe3ee; --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px;
      background: var(--bg); color: var(--fg);
      font: 15px/1.45 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: min(640px, 100%); min-height: 780px; display: flex; flex-direction: column;
      background: var(--card); border-radius: 28px; padding: 36px 36px 28px;
      border: 1px solid #eceef2;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 40px rgba(15, 23, 42, .06);
    }
    header { display: flex; align-items: flex-start; gap: 12px; }
    h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
    .sub { margin: 6px 0 0; color: #475569; font-size: 15px; }
    .tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .sound {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--chip-line);
      background: var(--chip); color: #475569; display: grid; place-items: center; cursor: pointer;
    }
    .sound:hover { color: var(--fg); }
    .sound svg { width: 18px; height: 18px; }
    .sound .off, .sound[aria-pressed="false"] .on { display: none; }
    .sound[aria-pressed="false"] .off { display: block; }
    .count {
      height: 40px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
      background: var(--chip); border: 1px solid var(--chip-line); color: #334155; font-size: 15px;
    }
    .count b { font-variant-numeric: tabular-nums; color: var(--fg); }
    .drop {
      margin-top: 36px; height: 290px; border: 2px dashed var(--dash); border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 40px; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .drop:hover, [data-swish-state] .drop { border-color: #a5b4fc; background: #fafaff; }
    .drop svg { width: 26px; height: 26px; color: var(--fg); }
    .drop strong { margin-top: 10px; font-weight: 550; font-size: 17px; }
    .drop span { color: var(--faint); font-size: 14px; }
    .files {
      list-style: none; margin: auto 0 0; padding: 24px 0 0; display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
    }
    .files li {
      font-size: 12px; color: #334155; background: var(--chip); border: 1px solid var(--chip-line);
      border-radius: 999px; padding: 3px 10px; max-width: 220px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      animation: pop .3s ease both;
    }
    @keyframes pop { from { transform: scale(.8); opacity: 0; } }
    footer { margin-top: 18px; text-align: center; color: var(--faint); font-size: 14px; }
    footer span { display: none; }
    html:not([data-swish-state]) footer .idle,
    [data-swish-state="incoming"] footer .incoming,
    [data-swish-state="holding"] footer .holding,
    [data-swish-state="aiming"] footer .aiming,
    [data-swish-state="shooting"] footer .shooting { display: inline; }
    footer .shooting { color: var(--accent); font-weight: 600; }
    details { width: min(640px, 100%); margin-top: 20px; color: var(--muted); font-size: 14px; }
    details summary { cursor: pointer; }
    details section { display: grid; gap: 14px; margin-top: 14px; }
    details label { display: grid; gap: 6px; }
    @media (max-width: 520px) {
      .card { padding: 24px 20px 20px; min-height: 680px; }
      header { flex-wrap: wrap; }
      .tools { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div>
    <main class="card">
      <header>
        <div>
          <h1>Upload files</h1>
          <p class="sub">Drag and drop, or take the shot.</p>
        </div>
        <div class="tools">
          <button class="sound" type="button" aria-pressed="true" aria-label="Sound">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
          </button>
          <div class="count">Uploaded <b id="uploaded">0</b></div>
        </div>
      </header>

      <label class="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
        <strong>Drop files here</strong>
        <span>or take the shot</span>
        <input type="file" id="main" multiple hidden>
      </label>

      <ul class="files" id="files"></ul>

      <footer>
        <span class="idle">Drag a file in to grab the ball</span>
        <span class="incoming">Drop it anywhere</span>
        <span class="holding">Now drag the file to take the shot · Esc to cancel</span>
        <span class="aiming">Release to shoot!</span>
        <span class="shooting">Swish!</span>
      </footer>
    </main>

    <details>
      <summary>More test fields</summary>
      <section>
        <label>Single file (only the first file should land)<input type="file" id="single"></label>
        <label>Multiple files<input type="file" id="multi" multiple></label>
      </section>
    </details>
  </div>

  <script>
    const total = document.getElementById('uploaded');
    const list = document.getElementById('files');
    let uploaded = 0;

    for (const input of document.querySelectorAll('input[type=file]')) {
      input.addEventListener('change', () => {
        for (const file of input.files) {
          const li = document.createElement('li');
          li.textContent = input.id === 'main' ? file.name : `${input.id}: ${file.name}`;
          li.title = li.textContent;
          list.append(li);
        }
        uploaded += input.files.length;
        total.textContent = uploaded;
      });
    }

    const sound = document.querySelector('.sound');
    sound.addEventListener('click', () => {
      const on = sound.getAttribute('aria-pressed') !== 'true';
      sound.setAttribute('aria-pressed', on);
      document.documentElement.toggleAttribute('data-swish-muted', !on);
    });
  </script>
  <!-- Lets the demo run without installing the extension. When the extension is
       installed, whichever copy loads first wins and the other no-ops. -->
  <script src="../src/content.js"></script>
</body>
</html>
